# Usage:
#   cp .env.default .env     # then fill in SECRET_KEY, WALLET_ENCRYPTION_KEYS and POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec web python manage.py createsuperuser
#
# Services: PostgreSQL, Redis, a one-shot migration job, the web app (gunicorn),
# a Celery worker, Celery Beat (scheduler) and the frontend (nginx serving the React app and
# proxying the API on the same origin). The web and frontend ports are published.
# Every long-running service has a healthcheck: `docker compose ps` shows (healthy) / (unhealthy).

x-app: &app
  # Built once by the "web" service; the other app services reuse the same image.
  image: django-central-wallet:latest
  pull_policy: never
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *app
    build: .
    pull_policy: build
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # GET /health/ (database + Redis). It is answered by the first middleware, before the
      # ALLOWED_HOSTS check and the HTTPS redirect, so 127.0.0.1 works with production settings.
      # urlopen raises on a 503, so the exit code is non-zero when unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["celery", "-A", "django_central_wallet", "worker", "--loglevel", "info", "--concurrency", "4"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Ping this container's own worker node (default name celery@<container hostname>) through
      # the broker, so it fails when the worker is hung or cannot reach Redis.
      test: ["CMD-SHELL", "celery -A django_central_wallet inspect ping --destination celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  beat:
    <<: *app
    command: ["celery", "-A", "django_central_wallet", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Start scheduling once a worker consumes the queue, so jobs do not pile up in Redis.
      worker:
        condition: service_healthy
    healthcheck:
      # The beat scheduler touches a heartbeat file on every tick (django_central_wallet/beat.py).
      test: ["CMD", "python", "-m", "django_central_wallet.beat"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    image: django-central-wallet-frontend:latest
    pull_policy: build
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
