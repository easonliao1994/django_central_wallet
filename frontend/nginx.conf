# Serves the built SPA and proxies the Django API on the same origin, so the browser needs no
# CORS and the API token never crosses origins. Runs as a non-root user on port 8080.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Django: REST API, admin, its static files, email links (/account/activate/...), health.
    location ~ ^/(account|blockchain|admin|static|health)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve index.html, never cached.
    location / {
        include /etc/nginx/security-headers.conf;
        expires epoch;
        try_files $uri /index.html;
    }
}
