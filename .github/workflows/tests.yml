name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway values for the test run only.
      SECRET_KEY: ci-only-insecure-secret-key
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      # web3 5.x does not support Python 3.11+.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          pip install -r requirements.txt

      - name: Prepare settings
        run: cp django_central_wallet/settings.py.default django_central_wallet/settings.py

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2
